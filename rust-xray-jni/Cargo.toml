[package]
name = "xray-android"
version = "0.0.2"
edition = "2024"

[lib]
name = "xray_android"
crate-type = ["cdylib"]

[dependencies]
xray_core = { package = "xray-rs", version = "3.0.9" }
jni = "0.21"
tokio = { version = "1.40", features = ["rt-multi-thread", "sync", "time", "net", "io-util"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
sha2 = "0.10"
hex = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
tracing-android = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
