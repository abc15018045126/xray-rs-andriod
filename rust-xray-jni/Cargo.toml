[package]
name = "xray-android"
version = "0.0.1"
edition = "2024"

[lib]
name = "xray_android"
crate-type = ["cdylib"]

[dependencies]
xray_core = { package = "xray-rs", version = "3.0.8" }
jni = "0.21"
tokio = { version = "1.40", features = ["rt-multi-thread", "sync", "time", "net", "io-util"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
